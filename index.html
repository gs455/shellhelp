<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ShellHelp</title>
<style>body{background:#111;color:#ddd;font:13px/1.3 system-ui,sans-serif;margin:0;padding:8px;max-width:900px}h1{font-size:14px;margin:0 0 6px}
form{display:flex;gap:4px}input{flex:1;background:#1c1c1c;color:#eee;border:1px solid #333;padding:5px;font:inherit}button{background:#2a2a2a;color:#ddd;border:1px solid #444;padding:3px 8px;cursor:pointer;font:inherit}
.r{display:grid;grid-template-columns:90px 1fr auto;gap:2px 6px;align-items:start;border-bottom:1px solid #222;padding:3px 0}.l{color:#8ab;font-weight:600}
code{font:12px ui-monospace,Consolas,monospace;color:#9e9;white-space:pre-wrap;word-break:break-all}.w{grid-column:2;color:#888;font-size:12px}#m{color:#c88;margin:4px 0}details summary{cursor:pointer;color:#8ab;padding:3px 0}</style></head><body>
<h1>ShellHelp — task → PowerShell / cmd / bash / macOS / fish</h1>
<form id=f><input id=q maxlength=500 placeholder="e.g. search my whole PC for files with invoice in the name" autofocus><button>Go</button></form><div id=m></div><div id=o></div>
<script>const L=[['powershell','PowerShell'],['cmd','cmd'],['bash','Linux bash'],['zsh_macos','macOS zsh']];
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const row=(k,n,d)=>{const x=d[k]||{};return `<div class=r><span class=l>${n}</span><code>${esc(x.cmd)}</code><button onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent);this.textContent='✓'">copy</button><span class=w>${esc(x.why)}</span></div>`};
f.onsubmit=async e=>{e.preventDefault();m.textContent='…';o.innerHTML='';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q.value})});const d=await r.json();
if(!r.ok){m.textContent=d.error;return}m.textContent='';o.innerHTML=L.map(([k,n])=>row(k,n,d)).join('')+`<details><summary>fish</summary>${row('fish','fish',d)}</details>`}catch{m.textContent='Network error'}};</script></body></html>
